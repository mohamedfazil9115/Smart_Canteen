<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#cf1757",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211117",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .main-gradient {
            background: linear-gradient(180deg, #A92655 0%, #FD8D67 100%);
        }
        .cta-gradient {
            background: linear-gradient(90deg, #cf1757 0%, #ff4b8b 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative min-h-screen w-full flex flex-col items-center justify-between main-gradient overflow-hidden pb-8">
<!-- Top App Bar / Header Navigation -->
<div class="w-full flex items-center p-6 justify-between">
<button id="signupBackBtn" class="text-white flex size-10 items-center justify-center rounded-full bg-white/10 cursor-pointer hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<div class="text-white font-semibold text-lg">Sign Up</div>
<div class="size-10"></div> <!-- Placeholder for balance -->
</div>
<!-- Main Content Wrapper -->
<div class="flex-1 w-full max-w-[420px] px-6 flex flex-col justify-center gap-8">
<!-- Headline Text -->
<div class="text-center space-y-2">
<h1 class="text-white text-4xl font-extrabold tracking-tight">Join the Queue-Jumpers</h1>
<p class="text-white/80 text-lg font-medium">Register to skip the canteen lines</p>
</div>
<!-- Registration Form Card (Glassmorphism) -->
<div class="glass-effect rounded-lg p-6 flex flex-col gap-4 shadow-2xl">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="text-white/90 text-sm font-semibold ml-1">Full Name</label>
<div class="relative group">
<input class="w-full h-14 bg-white/5 border border-white/20 rounded-full px-6 text-white placeholder:text-white/40 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="e.g. John Doe" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-white/30">person</span>
</div>
</div>
<!-- Student ID -->
<div class="flex flex-col gap-1.5">
<label class="text-white/90 text-sm font-semibold ml-1">Student ID</label>
<div class="relative">
<input class="w-full h-14 bg-white/5 border border-white/20 rounded-full px-6 text-white placeholder:text-white/40 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="e.g. 123456" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-white/30">badge</span>
</div>
</div>
<!-- College Email -->
<div class="flex flex-col gap-1.5">
<label class="text-white/90 text-sm font-semibold ml-1">College Email</label>
<div class="relative">
<input class="w-full h-14 bg-white/5 border border-white/20 rounded-full px-6 text-white placeholder:text-white/40 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="name@college.edu" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-white/30">mail</span>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="text-white/90 text-sm font-semibold ml-1">Password</label>
<div class="relative">
<input class="w-full h-14 bg-white/5 border border-white/20 rounded-full px-6 text-white placeholder:text-white/40 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-white/30">lock</span>
</div>
</div>
<!-- Primary CTA -->
<button class="cta-gradient text-white h-14 rounded-full font-bold text-lg shadow-lg shadow-primary/20 active:scale-95 transition-transform mt-4 flex items-center justify-center gap-2">
                    Create Account
                    <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>
<!-- Footer Actions -->
<div class="w-full flex flex-col items-center gap-4 mt-8">
<a id="loginLink" class="text-white/90 text-base font-semibold hover:text-white transition-colors cursor-pointer">
                Already have an account? <span class="underline underline-offset-4 decoration-primary decoration-2">Login</span>
</a>
<div class="flex items-center gap-2 mt-2">
<div class="h-1 w-8 bg-white/20 rounded-full"></div>
<div class="h-1 w-12 bg-white rounded-full"></div>
<div class="h-1 w-8 bg-white/20 rounded-full"></div>
</div>
</div>
<!-- Decorative elements to enhance premium feel -->
<div class="absolute -top-20 -left-20 w-64 h-64 bg-white/10 blur-[100px] rounded-full"></div>
<div class="absolute -bottom-20 -right-20 w-80 h-80 bg-primary/20 blur-[120px] rounded-full"></div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    console.log('Signup page loaded');
    
    // Back button
    const signupBackBtn = document.getElementById('signupBackBtn');
    if (signupBackBtn) {
      signupBackBtn.addEventListener('click', () => {
        console.log('Back button clicked');
        window.location.href = 'index.html';
      });
    }

    // Get all input fields in order: Full Name, Student ID, Email, Password
    const allInputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]');
    console.log('Found inputs:', allInputs.length);

    // Create Account button
    const createBtn = document.querySelector('.cta-gradient');
    if (createBtn) {
      createBtn.addEventListener('click', function(e) {
        e.preventDefault();
        console.log('Create Account button clicked');
        
        // Get values from inputs in order
        const fullName = allInputs[0]?.value.trim() || '';
        const studentId = allInputs[1]?.value.trim() || '';
        const email = allInputs[2]?.value.trim() || '';
        const password = allInputs[3]?.value.trim() || '';

        console.log('Form Data:', { fullName, studentId, email, password });

        // Validation
        if (!fullName) {
          alert('❌ Please enter your full name');
          allInputs[0]?.focus();
          return;
        }
        if (!studentId) {
          alert('❌ Please enter your student ID');
          allInputs[1]?.focus();
          return;
        }
        if (!email) {
          alert('❌ Please enter your college email');
          allInputs[2]?.focus();
          return;
        }
        if (!email.includes('@')) {
          alert('❌ Please enter a valid email address');
          allInputs[2]?.focus();
          return;
        }
        if (!password) {
          alert('❌ Please enter a password');
          allInputs[3]?.focus();
          return;
        }
        if (password.length < 6) {
          alert('❌ Password must be at least 6 characters');
          allInputs[3]?.focus();
          return;
        }

        // Check if student ID already exists
        const users = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
        if (users[studentId]) {
          alert('❌ This Student ID is already registered.\n\nPlease login instead or use a different Student ID.');
          return;
        }

        try {
          // Register new user
          users[studentId] = {
            name: fullName,
            studentId: studentId,
            email: email,
            password: password,
            registeredAt: new Date().toISOString()
          };
          localStorage.setItem('registeredUsers', JSON.stringify(users));
          
          // Store for auto-fill on login
          sessionStorage.setItem('newSignup', JSON.stringify({
            studentId: studentId,
            name: fullName
          }));
          
          console.log('Account created successfully');
          alert('✅ Account created successfully!\n\nRedirecting to login...');
          window.location.href = 'student_Login.html';
        } catch (error) {
          console.error('Error creating account:', error);
          alert('❌ Error creating account. Please try again.');
        }
      });
    }

    // Already have account link
    const loginLink = document.getElementById('loginLink');
    if (loginLink) {
      loginLink.addEventListener('click', function(e) {
        e.preventDefault();
        console.log('Login link clicked');
        window.location.href = 'student_Login.html';
      });
    } else {
      console.error('Login link not found!');
    }
  });
</script>
</body></html>
