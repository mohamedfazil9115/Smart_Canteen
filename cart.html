<!-- Payment Method Selection -->
<div class="px-4 mt-8">

<div class="space-y-3">
<!-- UPI Option -->
<label class="flex items-center gap-4 glass-card p-4 rounded-full border border-white/20 cursor-pointer hover:bg-white/10 transition-colors">
<input checked="" class="w-5 h-5 text-primary border-white/30 bg-transparent focus:ring-offset-0 focus:ring-0" name="payment" type="radio"/>
<div class="flex items-center gap-3 flex-1">

</div>
<span class="material-symbols-outlined text-white/50">chevron_right</span>
</label>
<!-- Card Option -->
<label class="flex items-center gap-4 glass-card p-4 rounded-full border border-white/20 cursor-pointer hover:bg-white/10 transition-colors">
<input class="w-5 h-5 text-primary border-white/30 bg-transparent focus:ring-offset-0 focus:ring-0" name="payment" type="radio"/>
<div class="flex items-center gap-3 flex-1">
<span class="material-symbols-outlined text-white">credit_card</span>
<p class="text-white font-semibold">Debit / Credit Card</p>
</div>

</label>
<!-- Wallet Option -->
<label class="flex items-center gap-4 glass-card p-4 rounded-full border border-white/20 cursor-pointer hover:bg-white/10 transition-colors">
<input class="w-5 h-5 text-primary border-white/30 bg-transparent focus:ring-offset-0 focus:ring-0" name="payment" type="radio"/>
<div class="flex items-center gap-3 flex-1">
<span class="material-symbols-outlined text-white">savings</span>

<!-- CTA Section -->
<div class="mt-auto px-4 pt-10 pb-8 flex flex-col items-center gap-4">
<button id="payBtn" onclick="processPayment()" class="w-full h-16 bg-gradient-to-r from-primary to-[#ff4e6a] text-white text-lg font-extrabold rounded-full shadow-2xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined">qr_code_2</span>
                Pay &amp; Generate QR
            </button>
<p class="text-white/70 text-xs text-center px-6 leading-relaxed">
                A QR code will be generated upon successful payment to be scanned at the counter for order collection.
            </p>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-6"></div>
</div>
<script>
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  
  // Global function to go back to menu
  function goBackMenu() {
    console.log('goBackMenu() called');
    window.location.href = 'menu.html';
  }
  
  // Global function to process payment
  function processPayment() {
    console.log('processPayment() called');
    
    // Check if cart has items
    if (cart.length === 0) {
      alert('❌ Your cart is empty. Please add items before proceeding.');
      return;
    }
    
    // Get selected payment method
    const selectedPayment = document.querySelector('input[name="payment"]:checked');
    const paymentMethod = selectedPayment ? selectedPayment.nextElementSibling.querySelector('p').textContent : 'UPI';
    
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    const orderID = '#ORD-' + Math.floor(Math.random() * 99999);
    
    // Store order details
    localStorage.setItem('orderTotal', (total * 83).toFixed(2));
    localStorage.setItem('orderID', orderID);
    localStorage.setItem('paymentMethod', paymentMethod);
    
    console.log('Processing payment:', { paymentMethod, total });
    alert('✅ Payment processing for ₹' + (total * 83).toFixed(0));
    
    // Add to order history before clearing cart
    const orderHistory = JSON.parse(localStorage.getItem('orderHistory')) || [];
    orderHistory.unshift({
      orderId: orderID,
      total: (total * 83).toFixed(0),
      itemCount: cart.length,
      paymentMethod: paymentMethod,
      timestamp: new Date().toISOString(),
      items: cart
    });
    localStorage.setItem('orderHistory', JSON.stringify(orderHistory));
    
    // Clear cart after payment
    localStorage.removeItem('cart');
    cart = [];
    console.log('Cart cleared after payment');
    
    // Navigate to payment page
    window.location.href = 'payment.html';
  }
  
  function updateCartDisplay() {
    const cartItemsContainer = document.querySelector('.px-4.mt-6');
    if (!cartItemsContainer) return;
    
    // Clear existing items
    cartItemsContainer.innerHTML = '';
    
    // Group items by title and count quantities
    const itemMap = {};
    cart.forEach(item => {
      if (itemMap[item.title]) {
        itemMap[item.title].quantity++;
      } else {
        itemMap[item.title] = { ...item, quantity: 1 };
      }
    });
    
    // Render items
    Object.values(itemMap).forEach((item, index) => {
      const itemHTML = `
        <div class="flex items-center gap-4 glass-card p-4 rounded-xl justify-between border border-white/10">
          <div class="flex items-center gap-4">
            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-16 shadow-lg" style='background-image: url("https://via.placeholder.com/100");'></div>
            <div class="flex flex-col justify-center">
              <p class="text-white text-base font-bold leading-tight">${item.title}</p>
              <p class="text-white/80 text-sm font-medium">₹${(item.price * 83).toFixed(0)}</p>
            </div>
          </div>
          <div class="shrink-0">
            <div class="flex items-center gap-3 text-white bg-black/20 rounded-full px-2 py-1">
              <button class="qty-minus text-base font-bold flex h-8 w-8 items-center justify-center rounded-full bg-white/20 hover:bg-white/30 cursor-pointer" data-index="${index}">-</button>
              <input class="text-base font-bold w-6 p-0 text-center bg-transparent focus:outline-0 focus:ring-0 border-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none" readonly type="number" value="${item.quantity}"/>
              <button class="qty-plus text-base font-bold flex h-8 w-8 items-center justify-center rounded-full bg-white/20 hover:bg-white/30 cursor-pointer" data-index="${index}">+</button>
            </div>
          </div>
        </div>
      `;
      cartItemsContainer.innerHTML += itemHTML;
    });
    
    // Add quantity button listeners
    document.querySelectorAll('.qty-plus').forEach(btn => {
      btn.addEventListener('click', function() {
        const itemTitle = Object.values(itemMap)[parseInt(this.dataset.index)].title;
        cart.push({ title: itemTitle, price: Object.values(itemMap)[parseInt(this.dataset.index)].price });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartDisplay();
        updateTotals();
      });
    });
    
    document.querySelectorAll('.qty-minus').forEach(btn => {
      btn.addEventListener('click', function() {
        const itemTitle = Object.values(itemMap)[parseInt(this.dataset.index)].title;
        const index = cart.findIndex(item => item.title === itemTitle);
        if (index > -1) {
          cart.splice(index, 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          updateCartDisplay();
          updateTotals();
        }
      });
    });
  }
  
  function updateTotals() {
    const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
    const tax = Math.round(subtotal * 0.05 * 100) / 100;
    const total = subtotal + tax;
    
    const summaryItems = document.querySelectorAll('.glass-card.rounded-xl.p-5 .flex.justify-between');
    if (summaryItems[0]) {
      summaryItems[0].querySelector('p:last-child').textContent = '₹' + (subtotal * 83).toFixed(0);
    }
    if (summaryItems[1]) {
      summaryItems[1].querySelector('p:last-child').textContent = '₹' + (tax * 83).toFixed(0);
    }
    if (summaryItems[2]) {
      summaryItems[2].querySelector('p:last-child').textContent = '₹' + (total * 83).toFixed(0);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    console.log('Cart page loaded');

    // Payment method selection (radio buttons)
    const paymentMethods = document.querySelectorAll('input[name="payment"]');
    paymentMethods.forEach(method => {
      method.addEventListener('change', function() {
        console.log('Payment method selected:', this.nextElementSibling.textContent);
      });
    });

    // Display cart items
    updateCartDisplay();
    updateTotals();
    
    // Initialize profile slide as hidden (already done via inline styles)
    console.log('Profile slide initialized');
  });
</script>
