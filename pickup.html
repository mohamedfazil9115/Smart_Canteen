<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Order Pickup QR Code</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ab2654",
                        "secondary": "#FD8D67",
                        "background-light": "#f8f6f7",
                        "background-dark": "#1f1317",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .bg-custom-gradient {
            background: linear-gradient(180deg, #A92655 0%, #FD8D67 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display">
<!-- Main Gradient Background Container -->
<div class="relative flex min-h-screen w-full flex-col bg-custom-gradient overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<button id="pickupBackBtn" class="text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-white/10 transition-colors cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Order Pickup</h2>
</div>
<!-- Status Badge -->
<div class="flex px-4 py-4 justify-center">
<div class="flex items-center gap-2 bg-white/20 backdrop-blur-md rounded-full px-4 py-2 border border-white/30">
<span class="size-2 rounded-full bg-green-400 animate-pulse"></span>
<span class="text-white text-sm font-bold leading-normal tracking-[0.015em]">Ready for Pickup</span>
</div>
</div>
<!-- QR Code Card -->
<div class="px-6 py-4 flex-1 flex flex-col items-center justify-center">
<div class="w-full max-w-sm bg-white rounded-xl p-8 shadow-2xl flex flex-col items-center">
<div class="w-full aspect-square bg-gray-100 rounded-lg flex items-center justify-center mb-6 overflow-hidden">
<img alt="QR Code for Order STU-9823" class="w-full h-full p-4" data-alt="A large black and white QR code on a white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrpjU7PVRYf6-M_G4Tdf0D4oZUdDsFmo8nQPsKAnaZePGK3I-pJvmX6cjJWELa9HCyJaLwFfa15pZR7iRDXi4ymZdT0Mf-q1UpaAJkM6bWtA3RlGAWOMYEOtPDwVgUmLfVzz0HhrrqEXOTmzg0XHmA_ZwnrBBaAsdirTdRgmboJekKGGSzv47czBViZXgsXeihLSQ-Qjyt9m11H7PXNRagrBYfJi_CMWKmQQlBUyO836qjfrrtzcZ7OOCOtC7N5575bl5V35E28Ic"/>
</div>
<p class="text-gray-500 text-sm font-medium text-center px-4 leading-relaxed">
                    Show this QR code at the canteen counter to collect your order.
                </p>
</div>
</div>
<!-- Order Summary Detail Section -->
<div class="bg-background-dark/30 backdrop-blur-xl rounded-t-xl mt-auto pb-10">
<div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto my-4"></div>
<!-- Headline Text (Order ID) -->
<h2 class="text-white tracking-light text-[28px] font-bold leading-tight px-6 text-center pb-2 pt-2">#STU-9823</h2>
<!-- Description List -->
<div class="px-6 py-2">
<div class="flex justify-between gap-x-6 py-3 border-b border-white/10">
<p class="text-white/60 text-sm font-normal leading-normal">Items</p>
<p class="text-white text-sm font-semibold leading-normal text-right">Cheese Burger, Fries, Coke</p>
</div>
<div class="flex justify-between gap-x-6 py-3">
<p class="text-white/60 text-sm font-normal leading-normal">Total Paid</p>
<p class="text-white text-lg font-bold leading-normal text-right" id="pickupTotal">₹0.00</p>
</div>
</div>
<!-- Single Button (Secondary Action) -->
<div class="flex px-6 py-3 justify-center gap-3">
<button class="flex-1 flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-4 bg-white text-primary text-sm font-bold leading-normal tracking-[0.015em] shadow-lg">
<span class="truncate">Order Details</span>
</button>
<button class="flex size-12 items-center justify-center rounded-full bg-white/10 border border-white/20 text-white">
<span class="material-symbols-outlined">share</span>
</button>
</div>
</div>
<!-- Safe area padding for mobile -->
<div class="h-4"></div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    console.log('Pickup page loaded');
    
    // Back button
    const pickupBackBtn = document.getElementById('pickupBackBtn');
    if (pickupBackBtn) {
      pickupBackBtn.addEventListener('click', () => {
        console.log('Back button clicked');
        window.location.href = 'payment.html';
      });
    }
    
    const buttons = document.querySelectorAll('button');

    // Get order ID from localStorage
    const orderID = localStorage.getItem('orderID') || '#STU-9823';
    const orderTotal = localStorage.getItem('orderTotal') || '0.00';
    
    // Update order ID on page
    const orderIDElement = document.querySelector('h2.text-white.tracking-light');
    if (orderIDElement) {
      orderIDElement.textContent = orderID;
    }
    
    // Update order total on page
    const pickupTotalElement = document.getElementById('pickupTotal');
    if (pickupTotalElement) {
      pickupTotalElement.textContent = '₹' + (parseFloat(orderTotal) || 0).toFixed(2);
    }
    
    console.log('Order Details:', { orderID, orderTotal });

    // Order Details button
    const detailsBtn = document.querySelector('button.flex-1');
    if (detailsBtn) {
      detailsBtn.addEventListener('click', function() {
        console.log('Order Details clicked');
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const itemNames = cart.map(item => item.title).join(', ');
        alert('📦 Order Details\n\nOrder ID: ' + orderID + '\nItems: ' + (itemNames || 'Cheese Burger, Fries, Coke') + '\nTotal: ₹' + orderTotal + '\n\n✅ Your order is ready for pickup at the counter!');
      });
    }
    
    // Share button
    buttons.forEach(btn => {
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon && icon.textContent.includes('share')) {
        btn.addEventListener('click', function() {
          console.log('Share clicked');
          const shareText = 'My order ' + orderID + ' is ready for pickup at Campus Canteen!';
          
          if (navigator.share) {
            navigator.share({
              title: 'Order Ready for Pickup',
              text: shareText
            }).catch(err => console.log('Share cancelled:', err));
          } else {
            alert('📤 Share:\n\n' + shareText);
          }
        });
      }
    });
  });
</script>
</body></html>
    });
  });
</script>
</body></html>
